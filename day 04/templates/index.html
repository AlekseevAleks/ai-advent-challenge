<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Сервис — сравнение temperature</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            resize: vertical;
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .error { color: #f87171; font-size: 14px; margin-top: 12px; display: none; }
        .loading { color: #fbbf24; font-size: 14px; margin-top: 12px; display: none; }
        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        .column {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .column h3 {
            font-size: 15px;
            color: #93c5fd;
            margin-bottom: 10px;
            text-align: center;
        }
        .column .text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }
        .comparison {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            display: none;
        }
        .comparison h3 { color: #fbbf24; margin-bottom: 10px; }
        .comparison .text { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
        @media (max-width: 800px) {
            .columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 AI Сервис</h1>
        <p class="subtitle">Один вопрос — три ответа с temperature 0, 0.7 и 1.2, затем сравнение</p>
        <textarea id="message" placeholder="Введите ваш вопрос..." rows="4"></textarea>
        <button id="send">Отправить</button>
        <div class="loading" id="loading">⏳ Отправка трёх запросов к ИИ и сравнение ответов...</div>
        <div class="error" id="error"></div>
        <div class="columns" id="columns"></div>
        <div class="comparison" id="comparison">
            <h3>📊 Сравнение и рекомендации</h3>
            <div class="text" id="comparisonText"></div>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('send');
        const messageInput = document.getElementById('message');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const columnsBox = document.getElementById('columns');
        const comparisonBox = document.getElementById('comparison');
        const comparisonText = document.getElementById('comparisonText');

        sendBtn.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            if (!message) {
                showError('Введите сообщение');
                return;
            }

            sendBtn.disabled = true;
            loading.style.display = 'block';
            errorBox.style.display = 'none';
            columnsBox.innerHTML = '';
            comparisonBox.style.display = 'none';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Ошибка сервера');
                } else {
                    renderColumns(data.responses);
                    comparisonText.textContent = data.comparison;
                    comparisonBox.style.display = 'block';
                }
            } catch (e) {
                showError('Не удалось связаться с сервером');
            } finally {
                sendBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function renderColumns(responses) {
            columnsBox.innerHTML = '';
            responses.forEach(r => {
                const col = document.createElement('div');
                col.className = 'column';
                const title = document.createElement('h3');
                title.textContent = 'temperature = ' + r.temperature;
                const text = document.createElement('div');
                text.className = 'text';
                text.textContent = r.text;
                col.appendChild(title);
                col.appendChild(text);
                columnsBox.appendChild(col);
            });
        }

        function showError(text) {
            errorBox.textContent = text;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
