<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Сервис — сравнение моделей</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .model-selects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .model-selects label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            resize: vertical;
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .error { color: #f87171; font-size: 14px; margin-top: 12px; display: none; }
        .loading { color: #fbbf24; font-size: 14px; margin-top: 12px; display: none; }
        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        .column {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .column h3 {
            font-size: 15px;
            color: #93c5fd;
            margin-bottom: 10px;
            text-align: center;
        }
        .meta {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .meta b { color: #fbbf24; }
        .column .text { font-size: 14px; line-height: 1.65; overflow-wrap: break-word; }
        .comparison {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            display: none;
        }
        .comparison h3 { color: #fbbf24; margin-bottom: 10px; }
        .comparison .text { font-size: 14px; line-height: 1.65; overflow-wrap: break-word; }
        /* Стили для markdown-контента */
        .text h1, .text h2, .text h3, .text h4, .text h5, .text h6 {
            margin: 12px 0 6px;
            color: #f8fafc;
            line-height: 1.3;
        }
        .text h1:first-child, .text h2:first-child, .text h3:first-child { margin-top: 0; }
        .text p { margin: 6px 0; }
        .text ul, .text ol { margin: 6px 0 6px 22px; }
        .text li { margin: 3px 0; }
        .text code {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 1px 5px;
            border-radius: 5px;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .text pre {
            background: #0b1120;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .text pre code { background: none; border: none; padding: 0; font-size: 13px; }
        .text blockquote {
            border-left: 3px solid #3b82f6;
            padding: 2px 0 2px 12px;
            color: #94a3b8;
            margin: 8px 0;
        }
        .text table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
        .text th, .text td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
        .text th { background: #1e293b; color: #93c5fd; }
        .text a { color: #93c5fd; }
        .text strong { color: #fbbf24; }
        .text hr { border: none; border-top: 1px solid #334155; margin: 12px 0; }
        @media (max-width: 800px) {
            .model-selects, .columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 AI Сервис</h1>
        <p class="subtitle">Один вопрос — три модели, затем сравнение по качеству, скорости и ресурсоёмкости</p>
        <div class="model-selects">
            <div>
                <label for="model1">Модель 1</label>
                <select id="model1"></select>
            </div>
            <div>
                <label for="model2">Модель 2</label>
                <select id="model2"></select>
            </div>
            <div>
                <label for="model3">Модель 3</label>
                <select id="model3"></select>
            </div>
        </div>
        <textarea id="message" placeholder="Введите ваш вопрос..." rows="4"></textarea>
        <button id="send">Отправить</button>
        <div class="loading" id="loading">⏳ Отправка трёх запросов к ИИ и сравнение ответов...</div>
        <div class="error" id="error"></div>
        <div class="columns" id="columns"></div>
        <div class="comparison" id="comparison">
            <h3>📊 Сравнение и рекомендации</h3>
            <div class="text" id="comparisonText"></div>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('send');
        const messageInput = document.getElementById('message');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error');
        const columnsBox = document.getElementById('columns');
        const comparisonBox = document.getElementById('comparison');
        const comparisonText = document.getElementById('comparisonText');
        const modelSelects = [document.getElementById('model1'), document.getElementById('model2'), document.getElementById('model3')];

        let models = [];

        async function loadModels() {
            try {
                const res = await fetch('/api/models');
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Не удалось загрузить модели');
                    return;
                }
                models = data.models;
                modelSelects.forEach((sel, i) => {
                    sel.innerHTML = '';
                    models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = m.name;
                        sel.appendChild(opt);
                    });
                    // По умолчанию: разные модели для наглядности
                    sel.selectedIndex = Math.min(i * 10, models.length - 1);
                });
            } catch (e) {
                showError('Не удалось загрузить список моделей');
            }
        }

        sendBtn.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            if (!message) {
                showError('Введите сообщение');
                return;
            }
            const selected = modelSelects.map(s => s.value);
            if (new Set(selected).size !== 3) {
                showError('Выберите три разные модели');
                return;
            }

            sendBtn.disabled = true;
            loading.style.display = 'block';
            errorBox.style.display = 'none';
            columnsBox.innerHTML = '';
            comparisonBox.style.display = 'none';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, models: selected })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Ошибка сервера');
                } else {
                    renderColumns(data.responses);
                    comparisonText.innerHTML = renderMarkdown(data.comparison);
                    comparisonBox.style.display = 'block';
                }
            } catch (e) {
                showError('Не удалось связаться с сервером');
            } finally {
                sendBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function renderColumns(responses) {
            columnsBox.innerHTML = '';
            responses.forEach(r => {
                const col = document.createElement('div');
                col.className = 'column';
                const title = document.createElement('h3');
                title.textContent = r.model;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.innerHTML =
                    '⏱ Время: <b>' + r.time_sec + ' с</b><br>' +
                    '🔢 Токены: <b>' + r.tokens + '</b> (вход ' + r.prompt_tokens + ' / выход ' + r.completion_tokens + ')<br>' +
                    '💰 Стоимость: <b>' + r.cost_rub + ' ₽</b>';
                const text = document.createElement('div');
                text.className = 'text';
                text.innerHTML = renderMarkdown(r.text);
                col.appendChild(title);
                col.appendChild(meta);
                col.appendChild(text);
                columnsBox.appendChild(col);
            });
        }

        function renderMarkdown(source) {
            if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
                // Библиотеки не загрузились — показываем текст как есть
                const el = document.createElement('div');
                el.textContent = source;
                return el.innerHTML;
            }
            return DOMPurify.sanitize(marked.parse(source));
        }

        function showError(text) {
            errorBox.textContent = text;
            errorBox.style.display = 'block';
        }

        loadModels();
    </script>
</body>
</html>
